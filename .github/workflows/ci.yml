name: ci
# Runs on GitHub's machines for every push and pull request: the unit tests
# and the repository rules. It needs no model and no private data.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    # Every Python that `requires-python` claims, each against pinned versions so
    # an upstream release cannot turn a required check red. constraints.txt pins
    # the 3.12 reference environment (numpy 2.5 needs 3.12+); 3.10 and 3.11 use
    # ci/constraints-<version>.txt, compiled for the `dev` extra.
    name: test (${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.3   # this action publishes no major-version tags after v7
      - name: Install ffmpeg
        run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
      - name: Install the package
        env:
          PYTHON: ${{ matrix.python }}
        run: |
          uv venv --python "$PYTHON"
          if [ "$PYTHON" = 3.12 ]; then pins=constraints.txt; else pins="ci/constraints-$PYTHON.txt"; fi
          uv pip install -e ".[dev]" -c "$pins"
          uv pip freeze
      - name: Repository rules (no audio, weights, home paths or sys.path edits; valid recipe)
        run: .venv/bin/python ci/check_hygiene.py
      - name: Tests
        run: .venv/bin/python -m pytest -q

  test:
    # The check name branch protection requires: passes only if every `unit` leg
    # did. `if: always()` matters, since a job skipped after a failed leg would
    # count as passing.
    if: always()
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          RESULT: ${{ needs.unit.result }}
        run: test "$RESULT" = success

  changes:
    # Is this a docs-only pull request (Markdown, docs/, LICENSE, NOTICE)? Then
    # `watermark` is skipped; `test` still runs, since the repository rules check
    # docs too. A skipped job counts as passing for branch protection.
    name: changes (ci)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      code: ${{ steps.files.outputs.code }}
    steps:
      - id: files
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if [ "$EVENT" != pull_request ]; then echo code=true >> "$GITHUB_OUTPUT"; exit 0; fi
          files=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --jq '.[].filename')
          echo "$files"
          if echo "$files" | grep -qvE '(\.md$|^docs/|^LICENSE$|^NOTICE$)'; then code=true; else code=false; fi
          echo "code=$code" | tee -a "$GITHUB_OUTPUT"

  watermark:
    # Every generated take must carry the watermark; this needs torch and the
    # AudioSeal models (CPU builds, downloaded on each run), which `test` avoids.
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.3
      - name: Install ffmpeg
        run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
      - name: Install the package with CPU torch and AudioSeal
        run: |
          uv venv --python 3.12
          uv pip install torch==2.14.1 torchaudio==2.11.0 --index-url https://download.pytorch.org/whl/cpu
          uv pip install -e ".[dev]" audioseal -c constraints.txt
      - name: Watermark tests
        run: .venv/bin/python -m pytest -q -rs tests/test_watermark.py
